<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="description" content="A score-free timeline of benchmark reporting across frontier model releases." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111716" />
    <link rel="canonical" href="https://junkim100.github.io/frontier-benchmarks/" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontier Benchmark Observatory</title>
  </head>
  <body data-page="timeline">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Frontier Benchmark Observatory">Observatory</a>
      <nav class="primary-nav" aria-label="Observatory"><ul><li><a aria-current="page" href="./">Timeline</a></li><li><a href="./ledger.html">Ledger</a></li><li><a href="./history.html">History</a></li><li><a href="./about.html">About</a></li></ul></nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">◐</span></button>
    </header>
    <main id="main" class="landing-main">
      <section class="landing-timeline page-shell" aria-labelledby="page-title">
        <h1 id="page-title">Frontier Benchmark Observatory</h1>
        <div class="timeline-workspace landing-workspace" id="timeline-workspace" role="region" aria-label="Release timeline workspace">
          <div class="route-toolbar" id="timeline-controls" data-route-controls="timeline"><p class="route-status" id="timeline-status" role="status" aria-live="polite">Timeline controls load here.</p></div>
          <div class="timeline-host timeline-host-compact" id="timeline-host" data-timeline-mode="compact" role="region" aria-label="Release timeline"><div class="timeline-mount" id="timeline-chart" aria-live="polite"><p class="timeline-pending">The release timeline loads here.</p></div><aside class="detail-panel-host" id="release-detail-host" aria-label="Pinned release detail" hidden></aside></div>
          <button class="button fullscreen-action" id="timeline-fullscreen-button" type="button" aria-pressed="false">Fullscreen</button>
        </div>
      </section>
      <noscript><section class="page-shell noscript"><h2>JavaScript is unavailable</h2><p>The interactive timeline requires JavaScript. The Ledger, History, and About pages remain available from the navigation.</p></section></noscript>
    </main>
    <script type="module" src="./shell.mjs"></script>
    <script type="module" src="./timeline.mjs"></script>
  </body>
</html>
